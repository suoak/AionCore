name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  migration-immutability:
    name: Migration Immutability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: bash scripts/migration/check-immutability.test.sh
      - run: bash scripts/migration/check-immutability.sh

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - run: cargo clippy --workspace -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - run: cargo check --workspace


  builtin-pack-sync:
    name: Builtin pack sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - name: Theme CSS and test-signed packs match sources
        run: cargo run -p aionui-extension --bin workmate-builtin-packs -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@nextest
      # E14 SSH resume e2e (crates/aionui-app/tests/remote_host_ssh_e2e.rs) runs its
      # own user-level sshd on a loopback high port from a temp dir; it only needs
      # the binary. REQUIRED=1 makes a missing sshd fail instead of skip.
      - name: OpenSSH server binary for the E14 SSH resume e2e
        run: test -x /usr/sbin/sshd || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends openssh-server)
      - run: cargo nextest run --workspace
        env:
          WORKMATE_E14_SSH_REQUIRED: "1"
      # nextest already runs the workspace unit and integration suites. Keep the
      # cargo test pass for the one class nextest intentionally does not run,
      # without executing every unit test a second time in one shared harness.
      - run: cargo test --workspace --doc

  windows-verified-reader:
    name: Windows Verified Reader
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Whole-crate `-D warnings` on Windows (slice W2b ported the last unix-only paths).
      RUSTFLAGS: "-D warnings"
      # A runner that cannot create file symlinks must FAIL the link-refusal tests, not skip them.
      AIONCORE_REQUIRE_LINK_PRIVILEGE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-windows
      - name: Whole-crate clippy, no warnings (aionui-extension, all targets)
        run: cargo clippy -p aionui-extension --all-targets -- -D warnings
      - name: Verified reader, local/host install, restore and pack tests (real Windows filesystem)
        run: |
          cargo test -p aionui-extension --lib -- --nocapture --test-threads=1 hub::verified_reader hub::host_fs_windows hub::local_package_install hub::host_package_install pack:: 2>&1 | tee test.log
          grep -E "test result: ok\. [1-9][0-9]* passed; 0 failed" test.log
          for t in windows_refuses_hard_links_streams_and_reserved_names a_linked_intermediate_directory_is_never_followed \
                   happy_path_creates_host_root_writes_only_covered_files_and_retains existing_symlink_named_like_root_is_not_followed \
                   windows_refuses_names_it_cannot_hold_before_creating_anything \
                   fresh_install_uses_derived_layout_writes_marker_and_leaves_no_staging \
                   same_version_reinstall_replaces_atomically_and_keeps_marker \
                   upgrade_switches_after_ready_and_removes_the_superseded_version \
                   restart_restores_the_marker_named_version_with_the_opened_directory_handle \
                   sweep_removes_only_leftovers_and_never_follows_symlinks \
                   uninstall_handles_absent_symlinked_and_present_name_directories \
                   windows_refuses_identities_that_encode_to_device_names \
                   crash_between_the_two_renames_is_rolled_back_by_the_startup_sweep \
                   rollback_is_reverified_and_ambiguous_leftovers_fail_closed \
                   windows_refuses_identities_that_differ_only_by_case \
                   case_alias_is_ascii_case_folding_of_a_different_entry \
                   short_name_aliases_are_refused_and_lookalikes_are_not \
                   final_path_must_be_the_root_followed_by_exactly_the_listed_names; do
            grep -E "$t \.\.\. ok" test.log
          done
          if grep -q "SKIPPED" test.log; then echo "::error::some Windows cases were SKIPPED (skipped is not passed)"; exit 1; fi
      - name: Full aionui-extension suite on Windows
        run: |
          cargo test -p aionui-extension --no-fail-fast 2>&1 | tee full.log
          # A failing test makes `tee` hide cargo's exit code, so assert the outcome explicitly.
          if grep -E "^test result: FAILED|\.\.\. FAILED" full.log; then echo "::error::failures in the full aionui-extension suite"; exit 1; fi
          for t in import_skills_replaces_dangling_link_with_copy export_skill_with_symlink_replaces_a_dangling_link \
                   packed_package_installs_restores_and_is_served_verified \
                   a_third_party_package_under_a_builtin_name_is_not_restored_and_is_replaced_by_the_pin \
                   app_update_upgrades_and_app_rollback_downgrades_to_the_pinned_version \
                   final_path_cross_check_refuses_a_short_name_alias \
                   bound_files_theme_css_comes_from_retained_root_not_ext_dir \
                   bound_files_theme_css_refuses_unlisted_mismatched_symlink_and_missing \
                   bound_files_i18n_refuses_unlisted_missing_mismatched_symlink_and_bad_json \
                   marked_version_dir_is_loaded_and_unmarked_or_inconsistent_layouts_are_not \
                   verified_serve_refuses_tampered_symlinked_and_missing_listed_files_without_path_fallback \
                   bound_files_i18n_route_omits_extension_when_root_file_is_tampered \
                   bound_files_get_themes_omits_theme_when_css_is_unverified \
                   signed_package_installs_binds_loads_and_survives_restart_and_upgrade \
                   uninstall_removes_marker_binding_and_tree_and_the_registry_entry \
                   installed_signed_extension_is_served_verified_from_its_retained_root \
                   startup_sweeps_abandoned_staging \
                   canonical_check_catches_symlink_alias_of_declared_entry \
                   asset_route_refuses_symlink_alias_of_declared_entry \
                   manager_start_refuses_before_spawn_when_integrity_declared \
                   exited_services_are_reaped_only_for_the_requested_user \
                   resolve_service_script_rejects_symlink_escape \
                   acquire_within_times_out_while_a_peer_holds_the_lock \
                   acquire_within_succeeds_once_the_peer_releases \
                   symlinks_and_directory_links_are_refused \
                   cli_refuses_outputs_inside_source_symlink_outputs_bad_sources_and_misuse \
                   catalogue_covers_exactly_the_codes_the_host_emits \
                   author_doc_lists_the_catalogue \
                   refusal_bodies_carry_the_fixed_reason_code_and_hint; do
            grep -E "$t \.\.\. ok" full.log
          done
          if grep -q "SKIPPED" full.log; then echo "::error::SKIPPED in the full suite"; exit 1; fi
      - name: Host app wiring (open_signed_extensions_parent, production built-ins) on Windows
        run: |
          cargo test -p aionui-app --lib -- host_signed_extensions builtin_extensions --nocapture --test-threads=1 2>&1 | tee app.log
          grep -E "test result: ok\. [1-9][0-9]* passed; 0 failed" app.log
          grep -E "pack_install_restart_restore_and_verified_serve_end_to_end \.\.\. ok" app.log
          grep -E "production_builtins_install_list_and_serve_verified_without_env_policy \.\.\. ok" app.log
          grep -E "production_builtins_configure_the_host_without_env_and_restore_on_restart \.\.\. ok" app.log
          grep -E "every_pack_signature_verifies_strictly_under_the_embedded_key \.\.\. ok" app.log
          grep -E "a_squatted_production_builtin_name_is_replaced_by_the_pinned_pack_at_startup \.\.\. ok" app.log
          grep -E "builtin_follows_the_app_binary_on_update_and_on_rollback \.\.\. ok" app.log
          if grep -q "SKIPPED" app.log; then echo "::error::SKIPPED in the app wiring tests"; exit 1; fi

  windows-builtin-diag:
    # TEMP DIAGNOSTIC (draft PR, never merged): why does the real Host fail built-in placement?
    name: Windows built-in diag (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-windows-diag
      - name: Tools and the Manual Build release binary
        run: |
          mkdir -p diag && cd diag
          gh run download 43569636887 -R suoak/AionCore -n aioncore-manual-windows-x64 -D rel
          find rel -type f | head
          for z in rel/*.zip; do [ -f "$z" ] && unzip -o -q "$z" -d rel; done
          curl -fsSL -o Handle.zip https://download.sysinternals.com/files/Handle.zip && unzip -o -q Handle.zip
          ls -la rel .
      - name: Probe function
        run: |
          cat > diag/probe.sh <<'SH'
          #!/usr/bin/env bash
          # probe.sh <exe> <label> <port>
          exe="$1"; label="$2"; port="$3"
          d="$RUNNER_TEMP/probe-$label"; rm -rf "$d"; mkdir -p "$d/logs"
          "$exe" --port "$port" --data-dir "$(cygpath -w "$d")" --log-level debug --log-dir "$(cygpath -w "$d/logs")" --local > "$d/stdout.txt" 2>&1 &
          pid=$!
          for i in $(seq 1 60); do grep -qE 'built-in (install refused|installed)|extension registry initialized' "$d/stdout.txt" 2>/dev/null && break; sleep 1; done
          sleep 3
          echo "===== [$label] built-in outcome"
          grep -E 'built-in|placing|signed extensions' "$d/stdout.txt" | sed -E 's/\x1b\[[0-9;]*m//g' | cut -c1-300
          echo "===== [$label] aioncore handles under the data dir"
          ./diag/handle64.exe -accepteula -nobanner -a -p "$(basename "$exe")" 2>&1 | grep -iE "probe-$label|extensions-signed|workmate\.|\.wip-" | head -60
          echo "===== [$label] tree"
          find "$d/extensions-signed" -maxdepth 3 2>/dev/null | head -40
          kill $pid 2>/dev/null; sleep 2
          SH
          chmod +x diag/probe.sh
      - name: Probe A - Manual Build release aioncore.exe
        run: diag/probe.sh "$(find diag/rel -name aioncore.exe | head -1)" rel 25901 || true

  changes:
    name: Detect dependency changes
    runs-on: ubuntu-latest
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/*/Cargo.toml'

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - run: cargo install cargo-audit --locked
      - run: cargo audit
