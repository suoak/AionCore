name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  migration-immutability:
    name: Migration Immutability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: bash scripts/migration/check-immutability.test.sh
      - run: bash scripts/migration/check-immutability.sh

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - run: cargo clippy --workspace -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - run: cargo check --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace
      # nextest already runs the workspace unit and integration suites. Keep the
      # cargo test pass for the one class nextest intentionally does not run,
      # without executing every unit test a second time in one shared harness.
      - run: cargo test --workspace --doc

  windows-verified-reader:
    name: Windows Verified Reader
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # The crate still has pre-existing Windows-only dead-code warnings (the install path is
      # not ported yet, slice W2), so `-D warnings` is replaced by the ratchet step below.
      RUSTFLAGS: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-windows
      - name: No warnings in the Windows verified reader files
        run: |
          cargo check -p aionui-extension --lib --tests --message-format=short 2>&1 | tee check.log
          if grep -E "(verified_reader|host_fs_windows)\.rs" check.log | grep -E "warning|error"; then
            echo "::error::warnings in the Windows verified reader files"
            exit 1
          fi
      - name: Reader conformance tests (real Windows filesystem)
        run: |
          cargo test -p aionui-extension --lib hub::verified_reader -- --nocapture --test-threads=1 2>&1 | tee test.log
          grep -E "test result: ok\. [1-9][0-9]* passed; 0 failed" test.log
          grep -E "windows_refuses_hard_links_streams_and_reserved_names \.\.\. ok" test.log
          grep -E "a_linked_intermediate_directory_is_never_followed \.\.\. ok" test.log
          if grep -q "SKIPPED" test.log; then echo "::warning::some symlink cases were skipped (no SeCreateSymbolicLinkPrivilege)"; fi

  changes:
    name: Detect dependency changes
    runs-on: ubuntu-latest
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/*/Cargo.toml'

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - run: cargo install cargo-audit --locked
      - run: cargo audit
