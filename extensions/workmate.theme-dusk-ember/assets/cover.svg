<svg width="360" height="224" viewBox="0 0 360 224" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dusk &amp; Ember (CSBU WorkMate)">
  <title>Dusk &amp; Ember (CSBU WorkMate)</title>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241843"/>
      <stop offset="100%" stop-color="#1d1533"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6ec"/>
      <stop offset="100%" stop-color="#fde6cf"/>
    </linearGradient>
  </defs>
  <!-- Original split composition: Dusk (violet) on the left, Ember (warm light) on the right. -->
  <rect width="180" height="224" fill="url(#dusk)"/>
  <rect x="180" width="180" height="224" fill="url(#ember)"/>
  <!-- Crescent moon (Dusk) -->
  <circle cx="90" cy="72" r="28" fill="#c38bff"/>
  <circle cx="102" cy="66" r="22" fill="#241843"/>
  <!-- Sun (Ember) -->
  <circle cx="270" cy="72" r="26" fill="#b4410f"/>
  <g stroke="#b4410f" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="270" y1="32" x2="270" y2="40"/>
    <line x1="270" y1="104" x2="270" y2="112"/>
    <line x1="230" y1="72" x2="238" y2="72"/>
    <line x1="302" y1="72" x2="310" y2="72"/>
    <line x1="242" y1="44" x2="248" y2="50"/>
    <line x1="292" y1="94" x2="298" y2="100"/>
    <line x1="242" y1="100" x2="248" y2="94"/>
    <line x1="292" y1="50" x2="298" y2="44"/>
  </g>
  <!-- Ground bands from the two palettes -->
  <rect x="0" y="168" width="180" height="56" fill="#150f28"/>
  <rect x="180" y="168" width="180" height="56" fill="#ecc9a5"/>
  <rect x="0" y="168" width="360" height="3" fill="#4a3480"/>
  <rect x="180" y="168" width="180" height="3" fill="#b4410f"/>
</svg>
