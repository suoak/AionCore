[package]
name = "aionui-extension"
version.workspace = true
edition.workspace = true

[dependencies]
aionui-common.workspace = true
aionui-db.workspace = true
aionui-api-types.workspace = true
aionui-auth.workspace = true
aionui-realtime.workspace = true
aionui-runtime.workspace = true
async-trait.workspace = true
axum.workspace = true
dirs.workspace = true
fs2.workspace = true
include_dir.workspace = true
semver.workspace = true
similar.workspace = true
notify.workspace = true
hex.workspace = true
getrandom.workspace = true
sha2.workspace = true
sha1.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tracing.workspace = true
mime_guess.workspace = true
zip.workspace = true
reqwest.workspace = true
url.workspace = true
tempfile.workspace = true

# NTFS junctions are used on Windows to materialize skill links without
# requiring `SeCreateSymbolicLink` (Developer Mode / Admin). Pulled in
# only on Windows targets to avoid building it on Linux/macOS.
[target.'cfg(windows)'.dependencies]
junction = "1"
# Handle-relative `NtCreateFile` for the Host verified reader (E13 W1). Already in the
# lockfile at this version via aionui-app; MIT OR Apache-2.0.
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

# openat/mkdirat for the Host-owned local package install root (unix only).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
async-trait.workspace = true
http-body-util.workspace = true
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
